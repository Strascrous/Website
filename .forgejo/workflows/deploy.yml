name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps:
        - uses: https://code.forgejo.org/actions/checkout@v6
        - name: Setup Node
          uses: https://github.com/actions/setup-node@v6
          with:
            node-version: lts/*
            cache: npm
        - name: Install Dependencies
          run: npm ci
        # The runner's CPU has no AVX2, which the native Astro compiler binding requires
        # (SIGILL / exit 132). Swap it for the WASI build: removing the native package makes
        # @astrojs/compiler-binding fall back to @astrojs/compiler-binding-wasm32-wasi.
        - name: Use WASI Astro compiler
          run: |
            v=$(node -p "require('@astrojs/compiler-binding/package.json').version")
            npm install --no-save --force "@astrojs/compiler-binding-wasm32-wasi@$v"
            rm -rf node_modules/@astrojs/compiler-binding-linux-x64-gnu
        - name: Build Website
          run: npm run build
        - name: Install SSH key
          uses: https://github.com/shimataro/ssh-key-action@v2
          with:
            key: ${{ secrets.DEPLOY_KEY }}
            name: id_ed25519
            known_hosts: ${{ secrets.KNOWN_HOSTS }}
            if_key_exists: replace
        - name: Install rSync
          run: |
              sudo apt-get update
              sudo apt-get install -y rsync
        - name: Deploy via SSH
          run: rsync -e "ssh -i ~/.ssh/id_ed25519" -az dist/* ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:/strascrous.fr
